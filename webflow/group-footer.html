<!-- KOKO audit 10: clarify guest count and optional room copy -->
<script>
(function(){
  function install(id,fix){
    var root=document.getElementById(id); if(!root)return;
    new MutationObserver(fix).observe(root,{childList:true,subtree:true,characterData:true});fix();
  }
  function start(){
    install('groupSlotsWrap',function(){
      var field=document.getElementById('groupGuests');
      var chip=document.querySelector('#groupSlotsWrap .koko-chip');
      var count=field&&parseInt(field.value,10);
      var label=count+' guests · minimum 10';
      if(chip&&count>=10&&chip.textContent!==label)chip.textContent=label;
    });
    install('groupAddonsWrap',function(){
      document.querySelectorAll('#groupAddonsWrap .koko-addon-card').forEach(function(card){
        var title=card.querySelector('.koko-addon-title'),note=card.querySelector('.koko-addon-note');
        if(!title||!note||!/party room/i.test(title.textContent))return;
        var copy='Add 60 minutes in a private party room after your game session. Charged for your total guest count.';
        if(note.textContent!==copy)note.textContent=copy;
      });
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
