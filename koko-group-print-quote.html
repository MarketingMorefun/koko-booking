<!-- KOKO Group Booking: "Save this quote as a PDF" button -->
<!-- Paste this into Webflow: /booking/group page settings → Custom code → Footer,
     BELOW the existing <script src="...koko-group-booking.js"> line. Do not remove that line. -->
<style>
.koko-print-quote-wrap{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.koko-print-quote{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:2px solid #221d16;border-radius:16px;background:#fffaf0;box-shadow:4px 4px 0 #221d16;font-weight:700;font-size:14px;color:#221d16;cursor:pointer;transition:all 140ms ease}
.koko-print-quote:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #221d16}
.koko-print-quote:active{transform:translate(0,0);box-shadow:2px 2px 0 #221d16}
.koko-print-hint{margin-top:8px;font-size:13px;color:#8a7d6a;text-align:center}
#kokoPrintRoot{display:none}
.koko-print-head{font-family:Arial,Helvetica,sans-serif;color:#2F241C}
.koko-print-head strong{font-size:18px;display:block;margin-bottom:6px}
.koko-print-head span{font-size:12px;color:#7B6A58}
@media print{
  /* Remove every top-level element from layout — this is what actually stops
     the blank pages, since visibility:hidden alone still reserves space. */
  body>*{display:none !important}
  #kokoPrintRoot{
    display:block !important;
    position:static !important;
    width:100% !important;
    max-width:680px !important;
    margin:0 auto !important;
    padding:0 !important;
  }
  #kokoPrintRoot *{visibility:visible !important;box-shadow:none !important}
  #kokoPrintRoot .koko-print-quote-wrap{display:none !important}
  @page{margin:14mm;size:A4}
}
</style>
<script>
(function(){
  function stripIds(el){
    if(!el||el.nodeType!==1)return;
    if(el.id)el.removeAttribute("id");
    var kids=el.children;
    for(var i=0;i<kids.length;i++)stripIds(kids[i]);
  }
  function ensureRoot(){
    var root=document.getElementById("kokoPrintRoot");
    if(!root){
      root=document.createElement("div");
      root.id="kokoPrintRoot";
      document.body.appendChild(root);
    }
    return root;
  }
  function printQuote(){
    var sec=document.getElementById("groupReviewSection");
    var root=ensureRoot();
    root.innerHTML="";
    var head=document.createElement("div");
    head.className="koko-print-head";
    head.innerHTML='<strong>KOKO Amusement — Group Booking Quote</strong><span>Generated '+new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})+' · Enquiries: marketing@morefun.com.au</span>';
    root.appendChild(head);
    if(sec){
      var clone=sec.cloneNode(true);
      stripIds(clone);
      clone.removeAttribute("style");
      var junk=clone.querySelectorAll(".koko-print-quote-wrap");
      for(var i=0;i<junk.length;i++)junk[i].parentNode.removeChild(junk[i]);
      root.appendChild(clone);
    }
    window.print();
  }
  function build(){
    var sec=document.getElementById("groupReviewSection");
    if(!sec||sec.getAttribute("data-print-ready"))return;
    var payBtn=document.getElementById("groupConfirmBtn");
    var card=(payBtn&&payBtn.parentNode)?payBtn.parentNode:sec;
    sec.setAttribute("data-print-ready","1");
    var wrap=document.createElement("div");
    wrap.className="koko-print-quote-wrap";
    var btn=document.createElement("button");
    btn.type="button";
    btn.className="koko-print-quote";
    btn.textContent="↓  Save this quote as a PDF";
    btn.addEventListener("click",printQuote);
    var hint=document.createElement("div");
    hint.className="koko-print-hint";
    hint.textContent="Choose “Save as PDF” in the print dialog to send it to your manager for approval.";
    wrap.appendChild(btn);wrap.appendChild(hint);card.appendChild(wrap);
  }
  function watch(){
    var sec=document.getElementById("groupReviewSection");
    if(sec&&sec.offsetParent!==null)build();
  }
  if(document.readyState!=="loading"){watch()}else{document.addEventListener("DOMContentLoaded",watch)}
  new MutationObserver(watch).observe(document.documentElement,{attributes:true,childList:true,subtree:true,attributeFilter:["style","class"]});
})();
</script>
