name: Booking reminders

# The every-5-minute schedule now runs from Apps Script (Reminders.gs),
# because GitHub's free scheduled runs were delayed by hours or skipped.
# This workflow is kept only as a manual backup: Actions tab → Booking
# reminders → Run workflow.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Xano RunReminders
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.REMINDER_SECRET }}\"}" \
            https://x8ki-letl-twmt.n7.xano.io/api:KARDPSrJ/RunReminders
