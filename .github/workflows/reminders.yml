name: Booking reminders

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min — reminder 1 goes out 15 min after an unpaid hold
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    # Runs once whenever this file itself is edited, so a change to the
    # schedule is exercised straight away instead of waiting for the cron.
    paths:
      - '.github/workflows/reminders.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Xano RunReminders
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.REMINDER_SECRET }}\"}" \
            https://x8ki-letl-twmt.n7.xano.io/api:KARDPSrJ/RunReminders
