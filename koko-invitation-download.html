<!-- KOKO Birthday Invitation Downloads -->
<style>
.koko-invite-dl{max-width:560px;margin:0 auto;background:#fff;border:1px solid #E8DDCC;border-radius:24px;padding:30px 26px;box-shadow:0 8px 26px rgba(47,36,28,.05);font-family:'Maven Pro',Arial,sans-serif;box-sizing:border-box;}
.koko-invite-dl .ki-eyebrow{display:inline-block;padding:8px 16px;border-radius:999px;background:#FFF3DF;color:#B86816;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
.koko-invite-dl h3{margin:16px 0 8px;font-size:24px;font-weight:900;color:#2F241C;line-height:1.15;}
.koko-invite-dl .ki-sub{color:#7B6A58;font-size:15px;line-height:1.5;margin:0 0 22px;}
.koko-invite-dl .ki-thumb{width:100%;border-radius:16px;border:1px solid #E8DDCC;display:block;margin:0 0 24px;}
.koko-invite-dl .ki-btns{display:grid;gap:12px;}
.koko-invite-dl .ki-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:900;font-family:inherit;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .1s ease;box-sizing:border-box;}
.koko-invite-dl .ki-btn:active{transform:scale(.985);}
.koko-invite-dl .ki-btn svg{width:20px;height:20px;flex:0 0 20px;}
.koko-invite-dl .ki-primary{background:#F28C28;color:#fff;box-shadow:0 6px 16px rgba(242,140,40,.28);}
.koko-invite-dl .ki-outline{background:#FFF7EB;color:#B86816;border-color:#F2B36F;}
.koko-invite-dl .ki-hint{margin:18px 0 0;text-align:center;color:#9A8B7C;font-size:12.5px;line-height:1.5;}
.koko-invite-dl .ki-btn.is-busy{opacity:.7;pointer-events:none;}
</style>
<div class="koko-invite-dl">
  <span class="ki-eyebrow">Your party invitation</span>
  <h3>Invite your guests in style</h3>
  <p class="ki-sub">Download the KOKO birthday invitation and print it &mdash; then fill in the location, date and time for your party.</p>
  <img class="ki-thumb" src="https://cdn.jsdelivr.net/gh/MarketingMorefun/koko-booking@7b356e7/koko-birthday-invitation.png" alt="KOKO birthday invitation preview">
  <div class="ki-btns">
    <a class="ki-btn ki-primary" href="https://cdn.jsdelivr.net/gh/MarketingMorefun/koko-booking@7b356e7/koko-birthday-invitation.png" data-koko-dl="KOKO Birthday Invitation.png">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download PNG Invitation
    </a>
    <a class="ki-btn ki-outline" href="https://cdn.jsdelivr.net/gh/MarketingMorefun/koko-booking@7b356e7/koko-birthday-invitation.pdf" data-koko-dl="KOKO Birthday Invitation.pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M7 3h8l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 14h6"/><path d="M9 17h4"/></svg>
      Download Printable PDF
    </a>
  </div>
  <p class="ki-hint">Tip: print at A4 for the best result.</p>
</div>
<script>
(function(){
  document.querySelectorAll('.koko-invite-dl [data-koko-dl]').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      if(a.classList.contains('is-busy'))return;
      var url=a.getAttribute('href'), name=a.getAttribute('data-koko-dl');
      a.classList.add('is-busy');
      fetch(url).then(function(r){return r.blob();}).then(function(blob){
        var link=document.createElement('a');
        link.href=URL.createObjectURL(blob);
        link.download=name;
        document.body.appendChild(link);link.click();link.remove();
        setTimeout(function(){URL.revokeObjectURL(link.href);},4000);
        a.classList.remove('is-busy');
      }).catch(function(){
        window.open(url,'_blank');
        a.classList.remove('is-busy');
      });
    });
  });
})();
</script>
